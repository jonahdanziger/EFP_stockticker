name: Weekly Stock Report

on:
  schedule:
    # 14:00 UTC every Saturday (~6-7 AM US Pacific). GitHub cron is always UTC;
    # "6" is Saturday. Friday's closing prices are final by this time.
    - cron: "0 14 * * 6"
  workflow_dispatch: {}   # allows a manual run from the Actions tab

# Let the workflow commit the archived report and publish to GitHub Pages.
permissions:
  contents: write
  pages: write
  id-token: write

# Only one Pages deployment at a time.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate weekly report and website payload
        run: python stock_ticker.py

      - name: Commit archived report to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A weekly_reports
          if git diff --staged --quiet; then
            echo "No archive changes to commit."
          else
            git commit -m "Update weekly report archive ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Upload site as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
